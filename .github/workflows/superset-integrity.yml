name: Super Set integrity
on:
  pull_request:
    paths:
      - 'app_v10_10_9_core.js'
      - 'modules/release-coherence-v10_10_10.js'
      - 'modules/technique-composition-integrity-v10_10_12.js'
      - 'update_v10_10_9.js'
      - 'scripts/superset-integrity-check.mjs'
      - 'scripts/technique-composition-integrity-check.mjs'
      - '.github/workflows/superset-integrity.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Validate Super Set integrity
        run: |
          node --check modules/release-coherence-v10_10_10.js
          node --check modules/technique-composition-integrity-v10_10_12.js
          node scripts/superset-integrity-check.mjs
          node scripts/technique-composition-integrity-check.mjs
